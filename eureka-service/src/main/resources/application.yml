# Eureka Server 자체 설정 (Config Server 의존성 제거)
server:
  port: 8761

spring:
  application:
    name: service-discovery

eureka:
  client:
    register-with-eureka: false    # 자기 자신을 등록하지 않음
    fetch-registry: false          # 레지스트리를 가져오지 않음
  server:
    enable-self-preservation: false # 개발환경에서 self-preservation 비활성화
    eviction-interval-timer-in-ms: 10000
  instance:
    hostname: localhost

logging:
  level:
    com.netflix.eureka: DEBUG