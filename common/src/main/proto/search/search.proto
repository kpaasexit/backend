syntax = "proto3";

package com.exit.common;

option java_multiple_files = true;
option java_package = "com.exit.common.grpc";
option java_outer_classname = "SearchServiceProto";

import "google/protobuf/timestamp.proto";

// 통합 검색 서비스 (Gateway에서 사용)
service SearchService {
  rpc SearchQuestions(SearchQuestionsRequest) returns (SearchQuestionsResponse);
  rpc SearchMagazines(SearchMagazinesRequest) returns (SearchMagazinesResponse);
}

// ============== Question Search ==============

message SearchQuestionsRequest {
  string keyword = 1;
  int32 page = 2;
  int32 size = 3;
}

message QuestionSearchItem {
  int64 question_id = 1;
  int64 question_category = 2;
  int64 question_writer_id = 3;
  string question_writer_name = 4;
  string question_title = 5;
  string question_content = 6;
  bool question_urgency = 7;
  string question_answer_type = 8;
  bool question_answer_adopt = 9;
  int32 answer_count = 10;
  google.protobuf.Timestamp created_at = 11;
}

message SearchQuestionsResponse {
  repeated QuestionSearchItem questions = 1;
  int32 total_count = 2;
  bool has_next = 3;
}

// ============== Magazine Search ==============

message SearchMagazinesRequest {
  string keyword = 1;
  int32 page = 2;
  int32 size = 3;
}

message MagazineSearchItem {
  int64 magazine_id = 1;
  int64 magazine_category_id = 2;
  string magazine_title = 3;
  string magazine_subtitle = 4;
  string magazine_content = 5;
  string magazine_author = 6;
  string author_profile_url = 7;
  string magazine_thumbnail_url = 8;
  google.protobuf.Timestamp created_at = 9;
}

message SearchMagazinesResponse {
  repeated MagazineSearchItem magazines = 1;
  int32 total_count = 2;
  bool has_next = 3;
}
