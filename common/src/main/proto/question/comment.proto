syntax = "proto3";

package com.exit.common;

option java_multiple_files = true;
option java_package = "com.exit.common.grpc";
option java_outer_classname = "CommentServiceProto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service CommentService {
  rpc CreateComment(CreateCommentRequest) returns (CreateCommentResponse);
  rpc DeleteComment(DeleteCommentRequest) returns (google.protobuf.Empty);
  rpc GetComment(GetCommentRequest) returns (GetCommentResponse);
}

// request
message CreateCommentRequest {
  int64 target_id = 1;
  string comment_type = 2;
  int64 writer_id = 3;
  string content = 4;
  string device_id = 5;
}

message DeleteCommentRequest {
  int64 comment_id = 1;
  int64 user_id = 2;
  string comment_type = 3;
}

message GetCommentRequest {
  int64 target_id = 1;
  string target_type = 2;
  int64 user_id = 3;
  int32 page_num = 4;
  int32 size = 5;
}

// response
message CreateCommentResponse {
  int64 comment_id = 1;
  string content = 2;
  string user_name = 3;
  google.protobuf.Timestamp created_at = 4;
}

message CommentItem {
  int64 comment_id = 1;
  string content = 2;
  string nickname = 3;
  string profile_image = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetCommentResponse {
  repeated CommentItem comment = 1;
  bool has_next = 2;
  int32 current_page = 3;
  int32 total_page_num = 4;
}