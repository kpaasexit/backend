name: Sync Dev to GitLab

on:
  push:
    branches:
      - dev

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Sync to GitLab
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 524288000
          
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.210-178-1-144.nip.io/gitlab-instance-9d8b5d85/backend.git
          
          git push gitlab dev:dev --force
