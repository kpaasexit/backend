server:
  port: 8080

spring:
  application:
    name: gateway-service
  #  cloud:
  #    gateway:
  #      mvc:
  #        routes:
  #          - id: user-service-route
  #            uri: lb://user-service
  #            predicates:
  #              - Path=/api/v1/users/**
  #              - Path=/api/auth/**
  #            filters:
  #              - StripPrefix=3
  #          - id: auth-service-route
  #            uri: lb://user-service
  #            predicates:
  #              - Path=/api/auth/**
  data:
    redis:
      host: ${redis.host}
      port: ${redis.port}
      database: ${redis.database}
      timeout: ${redis.timeout}
      lettuce:
        pool:
          max-active: ${redis.lettuce.pool.max-active}
          max-idle: ${redis.lettuce.pool.max-idle}
          min-idle: ${redis.lettuce.pool.min-idle}
          max-wait: ${redis.lettuce.pool.max-wait}q

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${oauth2.kakao.client-id}
            client-secret: ${oauth2.kakao.client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          naver:
            client-id: ${oauth2.naver.client-id}
            client-secret: ${oauth2.naver.client-secret}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# OAuth2 리다이렉트 설정
app:
  oauth2:
    allowed-origins: https://localhost:*,https://house-it.*,http://localhost:*
    default-client-url: https://house-it.210-178-1-144.nip.io
    cookie-secure: true  # true: 크로스 도메인 지원 (secure + sameSite=None)

# gRPC Client 설정 (Eureka 기반 로드밸런싱)
grpc:
  client:
    user-service:
      address: discovery:///user-service  # Eureka에서 서비스 발견
      negotiation-type: plaintext
    question-service:
      address: discovery:///question-service  # Eureka에서 서비스 발견
      negotiation-type: plaintext
    quiz-service:
      address: discovery:///quiz-service  # Eureka에서 서비스 발견
      negotiation-type: plaintext
    magazine-service:
      address: discovery:///magazine-service  # Eureka에서 서비스 발견
      negotiation-type: plaintext
    notification-service:
      address: discovery:///notification-service  # Eureka에서 서비스 발견
      negotiation-type: plaintext