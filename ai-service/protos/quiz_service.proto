syntax = "proto3";

package quiz;

// 퀴즈 관리 서비스
service QuizService {
    // 퀴즈 생성 (수동)
    rpc CreateQuiz(CreateQuizRequest) returns (CreateQuizResponse);

    // 퀴즈 수정
    rpc UpdateQuiz(UpdateQuizRequest) returns (UpdateQuizResponse);

    // 퀴즈 생성 (GPT 사용)
    rpc GenerateQuiz(GenerateQuizRequest) returns (GenerateQuizResponse);

    // 퀴즈 조회
    rpc GetQuiz(GetQuizRequest) returns (GetQuizResponse);

    // 퀴즈 목록 조회
    rpc ListQuizzes(ListQuizzesRequest) returns (ListQuizzesResponse);

    // 퀴즈 제목 유사도 검사
    rpc CheckQuizSimilarity(CheckQuizSimilarityRequest) returns (CheckQuizSimilarityResponse);

    // 일일 퀴즈 생성
    rpc GenerateDailyQuizzes(GenerateDailyQuizzesRequest) returns (GenerateDailyQuizzesResponse);

    // 퀴즈 오류 수정
    rpc CorrectQuiz(CorrectQuizRequest) returns (CorrectQuizResponse);

    // 스케줄러 제어
    rpc StartScheduler(StartSchedulerRequest) returns (SchedulerStatusResponse);
    rpc StopScheduler(StopSchedulerRequest) returns (SchedulerStatusResponse);

    // Spring 서버로 퀴즈 전송
    rpc SendQuizToSpring(SendQuizToSpringRequest) returns (SendQuizToSpringResponse);
}

// 퀴즈 관리 메시지

// 퀴즈 타입
enum QuizType {
    QUIZ_TYPE_UNSPECIFIED = 0;
    OX = 1;
    FOUR_LIMBS = 2;
}

// 퀴즈 메시지
message Quiz {
    int64 quiz_id = 1;
    int32 quiz_category_id = 2;
    string quiz_title = 3;
    string quiz_content = 4;
    QuizType quiz_type = 5;
    string quiz_correct_answer = 6;
    string quiz_additional_information = 7;
    int64 quiz_created_at = 8;  // Unix 타임스탬프
    int64 quiz_updated_at = 9;  // Unix 타임스탬프
}

// 퀴즈 생성 요청
message CreateQuizRequest {
    int32 quiz_category_id = 1;
    string quiz_title = 2;
    string quiz_content = 3;
    QuizType quiz_type = 4;
    string quiz_correct_answer = 5;
    string quiz_additional_information = 6;
}

// 퀴즈 생성 응답
message CreateQuizResponse {
    Quiz quiz = 1;
    bool success = 2;
    string message = 3;
}

// 퀴즈 업데이트 요청
message UpdateQuizRequest {
    int64 quiz_id = 1;
    optional int32 quiz_category_id = 2;
    optional string quiz_title = 3;
    optional string quiz_content = 4;
    optional QuizType quiz_type = 5;
    optional string quiz_correct_answer = 6;
    optional string quiz_additional_information = 7;
}

// 퀴즈 업데이트 응답
message UpdateQuizResponse {
    Quiz quiz = 1;
    bool success = 2;
    string message = 3;
}

// 퀴즈 생성 요청 (GPT 사용)
message GenerateQuizRequest {
    int32 category_id = 1;
    int32 count = 2;
    optional QuizType quiz_type = 3;
}

// 퀴즈 생성 응답 (GPT 사용)
message GenerateQuizResponse {
    repeated Quiz quizzes = 1;
    bool success = 2;
    string message = 3;
}

// 퀴즈 조회 요청
message GetQuizRequest {
    int64 quiz_id = 1;
}

// 퀴즈 조회 응답
message GetQuizResponse {
    Quiz quiz = 1;
    bool success = 2;
    string message = 3;
}

// 퀴즈 목록 조회 요청
message ListQuizzesRequest {
    optional int32 category_id = 1;
    int32 limit = 2;
}

// 퀴즈 목록 조회 응답
message ListQuizzesResponse {
    repeated Quiz quizzes = 1;
    bool success = 2;
    string message = 3;
}

// 유사도 검사 요청
message CheckQuizSimilarityRequest {
    string title = 1;
    int32 category_id = 2;
    float threshold = 3;
}

// 유사한 퀴즈 정보
message SimilarQuiz {
    string title = 1;
    float score = 2;
}

// 유사도 검사 응답
message CheckQuizSimilarityResponse {
    string title = 1;
    int32 category_id = 2;
    float threshold = 3;
    repeated SimilarQuiz similar_quizzes = 4;
    bool is_duplicate = 5;
    bool success = 6;
    string message = 7;
}

// 일일 퀴즈 생성 요청
message GenerateDailyQuizzesRequest {
    // 현재는 파라미터 없음 (기본값: 10문제, 8개 카테고리 분배)
}

// 일일 퀴즈 생성 응답
message GenerateDailyQuizzesResponse {
    repeated int64 quiz_ids = 1;
    int32 count = 2;
    bool success = 3;
    string message = 4;
}

// 퀴즈 수정 요청
message CorrectQuizRequest {
    int64 quiz_id = 1;
    optional string error_description = 2;
}

// 퀴즈 수정 응답
message CorrectQuizResponse {
    Quiz quiz = 1;
    bool success = 2;
    string message = 3;
}

// 스케줄러 시작 요청
message StartSchedulerRequest {
    // 현재는 파라미터 없음
}

// 스케줄러 중지 요청
message StopSchedulerRequest {
    // 현재는 파라미터 없음
}

// 스케줄러 상태 응답
message SchedulerStatusResponse {
    bool is_running = 1;
    bool success = 2;
    string message = 3;
}

// Spring 서버로 퀴즈 전송 요청
message SendQuizToSpringRequest {
    int64 quiz_id = 1;
    int64 quiz_category_id = 2;
    string quiz_title = 3;
    string quiz_content = 4;
    string quiz_type = 5;
    string quiz_correct_answer = 6;
    string quiz_additional_information = 7;
}

// Spring 서버로 퀴즈 전송 응답
message SendQuizToSpringResponse {
    bool success = 1;
    string message = 2;
}