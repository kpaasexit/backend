[tool:pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may use mocks or test containers)
    e2e: End-to-end tests (full system tests)
    grpc: gRPC related tests
    slow: Slow running tests (> 5 seconds)
    requires_api: Tests requiring external API (OpenAI, etc.)
    requires_models: Tests requiring ML models (may be slow)

# Test options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --color=yes
    --disable-warnings
    --timeout=60

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Asyncio mode
asyncio_mode = strict

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:transformers.*
    ignore::FutureWarning:transformers.*

# Test discovery
norecursedirs =
    .git
    .tox
    .env
    __pycache__
    .pytest_cache
    build
    dist
    *.egg

# Environment variables for testing
env =
    TESTING = true
    LOG_LEVEL = INFO
    PYTHONPATH = .