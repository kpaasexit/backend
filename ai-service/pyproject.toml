[tool.poetry]
name = "nlp-service"
version = "1.0.0"
description = "NLP Service for AI-powered question processing"
authors = ["NLP Service Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"

# Web frameworks
fastapi = "^0.104.0"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
python-multipart = "^0.0.6"

# gRPC
grpcio = "^1.60.0"
grpcio-tools = "^1.60.0"
grpcio-reflection = "^1.60.0"

# ML/NLP
torch = {version = "^2.6.0+cu118", source = "pytorch-cu118"}
torchvision = {version = "^0.21.0+cu118", source = "pytorch-cu118"}
torchaudio = {version = "^2.6.0+cu118", source = "pytorch-cu118"}
transformers = "^4.36.0"
sentence-transformers = "^2.2.0"
onnx = "^1.15.0"
onnxruntime = "^1.16.0"
optimum = "^1.16.0"

# Vector DB
qdrant-client = "^1.7.0"

# OpenAI
openai = "^1.6.0"

# Utilities
python-dotenv = "^1.0.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
redis = "^5.0.0"
aiocache = "^0.12.0"

# Service Discovery
py-eureka-client = "^0.11.9"

# Monitoring
prometheus-client = "^0.19.0"
psutil = "^5.9.0"

# Language processing
langdetect = "^1.0.9"
pandas = "^2.3.2"
openpyxl = "^3.1.5"
scikit-learn = "^1.7.2"
numpy = "<2"

# Scheduler
apscheduler = "^3.10.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
black = "^23.0.0"
isort = "^5.12.0"
mypy = "^1.7.0"

[[tool.poetry.source]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"